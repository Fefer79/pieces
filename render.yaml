services:
  - type: web
    name: pieces-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -F shared db:generate && pnpm -F api build
    # Les migrations s'appliquent ici, et NULLE PART AILLEURS. Le script `start`
    # de apps/api les lançait aussi : `prisma migrate deploy` tournait deux fois
    # par démarrage, chaque passage prenant le verrou consultatif Postgres
    # (timeout 10 s). Pendant un déploiement sans coupure, l'instance sortante et
    # l'entrante se le disputaient — P1002, déploiement en échec, redémarrage qui
    # réussit, et Render restait sur le commit précédent.
    startCommand: pnpm -F shared exec prisma migrate deploy && pnpm -F api start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: PINO_LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
